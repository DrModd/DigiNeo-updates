name: uac2neo (u_audio.ko + usb_f_uac2.ko для NanoPi NEO3, ядро 5.15.93-PureOS)

on:
  push:
    paths: [ 'tools/uac2neo/**', 'tools/dwc2neo/kconfig', '.github/workflows/uac2neo.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu bc flex bison libssl-dev libelf-dev xz-utils kmod
      - name: Kernel source 5.15.93
        run: |
          curl -fsSL -o /tmp/linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.15.93.tar.xz
          tar -xJf /tmp/linux.tar.xz -C /tmp
      - name: Prepare (same config as the board)
        run: |
          K=/tmp/linux-5.15.93
          cp tools/dwc2neo/kconfig $K/.config
          make -C $K ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "== config differences (new compiler) =="
          diff <(grep -E '^(CONFIG_|# CONFIG_)' tools/dwc2neo/kconfig | sort) <(grep -E '^(CONFIG_|# CONFIG_)' $K/.config | sort) | head -60 || true
          make -C $K ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          grep -E 'UTS_RELEASE' $K/include/generated/utsrelease.h
      - name: Build u_audio.ko + usb_f_uac2.ko
        run: bash tools/uac2neo/build.sh /tmp/linux-5.15.93 tools/uac2neo/out
      - name: Report
        run: |
          for f in u_audio usb_f_uac2; do modinfo tools/uac2neo/out/$f.ko | grep -E 'vermagic|license|depends'; sha256sum tools/uac2neo/out/$f.ko; done
      - name: Commit the modules
        run: |
          mkdir -p tools/uac2neo/bin && cp tools/uac2neo/out/*.ko tools/uac2neo/bin/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/uac2neo/bin/*.ko
          git diff --cached --quiet || { git commit -m "tools/uac2neo: built u_audio.ko, usb_f_uac2.ko (5.15.93-PureOS)"; git pull --rebase -q; git push; }
      - uses: actions/upload-artifact@v4
        with:
          name: uac2neo
          path: tools/uac2neo/bin/*.ko
